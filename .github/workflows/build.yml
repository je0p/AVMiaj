name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile (Java 11 compatible)
        run: |
          mkdir out
          javac --release 11 -Xlint:all -d out $(find src -name '*.java')

      - name: Build jar
        run: |
          jar cfe avmiaj.jar avmiaj.Main -C out .
          sha256sum avmiaj.jar > avmiaj.jar.sha256
          java -jar avmiaj.jar --help

      - uses: actions/upload-artifact@v4
        with:
          name: avmiaj
          path: |
            avmiaj.jar
            avmiaj.jar.sha256

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            avmiaj.jar
            avmiaj.jar.sha256
